<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Only Script I Never Mind Debugging</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #05010a;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 20px 10px;
    }
    .header {
      text-align: center;
      z-index: 10;
      margin-top: 15px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .header p {
      font-size: 10px;
      color: #aaa;
      margin-top: 4px;
    }
    .canvas-container {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 8px;
    }
    .footer {
      text-align: center;
      z-index: 10;
      margin-bottom: 15px;
    }
    .footer p {
      font-size: 12px;
      color: #fff;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Header Text -->
  <div class="header">
    <h1>"THE ONLY SCRIPT I NEVER MIND DEBUGGING." ❤️</h1>
    <p>@CODE_AND_CREATIVITY</p>
  </div>

  <!-- Animation Screen -->
  <div class="canvas-container">
    <canvas id="matrixCanvas" width="320" height="380"></canvas>
  </div>

  <!-- Footer Text -->
  <div class="footer">
    <p>COMMENT " CODE "</p>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    const width = canvas.width;
    const height = canvas.height;

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ❤❤';
    const fontSize = 10;
    const columns = Math.floor(width / fontSize);
    const drops = Array(columns).fill(1);

    let stage = 0; // Animation States
    let countdownNum = 3;
    let wordIndex = 0;
    const words = ["You", "Are", "My", "Love"];

    // Background Matrix Rain
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#e60073';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.95) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Overlay Center Text (Countdown / Words)
    function drawCenterText(text) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 15;
      ctx.fillText(text, width / 2, height / 2);
      ctx.shadowBlur = 0; // reset
    }

    // Final Heart Matrix Shape
    function drawHeartShape() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';

      // Mathematical Heart Coordinate Plotting
      for (let y = -1.3; y <= 1.3; y += 0.08) {
        for (let x = -1.3; x <= 1.3; x += 0.05) {
          let formula = Math.pow(x*x + y*y - 1, 3) - x*x * Math.pow(y, 3);
          if (formula <= 0) {
            let px = width / 2 + x * 90;
            let py = height / 2 - y * 90;
            let char = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(char, px, py);
          }
        }
      }

      // Inside Heart Text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Arial';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 10;
      ctx.fillText("I Love You", width / 2, height / 2);
    }

    // Animation Timeline Loop
    function animate() {
      if (stage < 3) {
        drawMatrix();
      }

      if (stage === 1) {
        drawCenterText(countdownNum);
      } else if (stage === 2) {
        drawCenterText(words[wordIndex]);
      } else if (stage === 3) {
        drawHeartShape();
      }
    }

    setInterval(animate, 40);

    // Sequence Control (Timings)
    setTimeout(() => { stage = 1; }, 1000); // Start Countdown

    let countInterval = setInterval(() => {
      if (stage === 1) {
        countdownNum--;
        if (countdownNum < 1) {
          clearInterval(countInterval);
          stage = 2; // Move to Words
          startWords();
        }
      }
    }, 1000);

    function startWords() {
      let wordInterval = setInterval(() => {
        wordIndex++;
        if (wordIndex >= words.length) {
          clearInterval(wordInterval);
          stage = 3; // Final Heart Shape
        }
      }, 900);
    }
  </script>
</body>
</html>
